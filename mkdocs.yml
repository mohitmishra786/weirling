site_name: Weirling
site_description: A personal reading digest that explains itself. Self-hosted or hosted, MIT.
site_url: https://weirling.com
repo_url: https://github.com/mohitmishra786/weirling
repo_name: mohitmishra786/weirling
edit_uri: edit/main/docs/

theme:
  name: material
  # System fonts: nothing is loaded from Google Fonts (see Privacy).
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  # One look with the app and landing page (#159): dark, copper accent.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Self-hosting:
      - Install & run: DEPLOYMENT.md
      - Upgrading: UPGRADING.md
      - Ranking sidecar: sidecar.md
  - Hosted service: HOSTING.md
  - Deploy to Vercel + Railway: deploy/railway-vercel.md
  - How it works:
      - Architecture: ARCHITECTURE.md
      - How ranking works: signals.md
      - Feedback mapping: feedback-mapping.md
  - Trust:
      - Security model: security.md
      - Privacy: PRIVACY.md
      - DPDP compliance checklist: compliance/dpdp-checklist.md
      - Data breach runbook: runbooks/data-breach.md
  - Quality:
      - Benchmarks: benchmarks.md
      - Email client check: email-clients.md
      - Replay evaluation: eval/replay-protocol.md
      - Embedding models: eval/embedding-models.md
  - Project:
      - Roadmap: milestones.md
      - Release notes:
          - v0.3.1: releases/v0.3.1.md
          - v0.3.0: releases/v0.3.0.md
          - v0.2.0: releases/v0.2.0.md
          - Template: releases/TEMPLATE.md
      - Decision records: adr/index.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Mermaid diagrams render in the browser; Material themes them for light and dark.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

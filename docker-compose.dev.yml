
# Local development overrides. Not applied automatically (#106):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# or `make up-dev`.

x-backend-dev: &backend-dev
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      LITE: 0
  volumes:
    - ./backend:/app

services:
  db:
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    <<: *backend-dev
    environment:
      APP_ENV: development
    command: sh -c "python -m app.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker-scrape:
    <<: *backend-dev
    environment:
      APP_ENV: development

  worker-embed:
    <<: *backend-dev
    environment:
      APP_ENV: development

  worker-digest:
    <<: *backend-dev
    environment:
      APP_ENV: development

  beat:
    <<: *backend-dev
    environment:
      APP_ENV: development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app/src
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
